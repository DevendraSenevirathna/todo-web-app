<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Todo App</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app-container">

        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">✓</span>
                <h1>TaskFlow</h1>
            </div>

            <p>Organize your tasks. Get things done.</p>
        </header>


        <!-- Add Todo -->
        <section class="todo-input-section">

            <input 
                type="text"
                id="todoInput"
                placeholder="What needs to be done?"
                autocomplete="off"
            >

            <button id="addTodoBtn">
                + Add Task
            </button>

        </section>


        <!-- Filter Buttons -->
        <nav class="filter-buttons">

            <button 
                class="filter-btn active"
                data-filter="all">
                All
            </button>

            <button 
                class="filter-btn"
                data-filter="active">
                Active
            </button>

            <button 
                class="filter-btn"
                data-filter="completed">
                Completed
            </button>

        </nav>


        <!-- Todo List -->
        <main id="todoList" class="todo-list">

            <!-- Todo items will be added using JavaScript -->

        </main>


        <!-- Empty Message -->
        <div id="emptyMessage" class="empty-message">

            <div class="empty-icon">✓</div>

            <h2>No tasks yet</h2>

            <p>Add a task above to get started.</p>

        </div>


        <!-- Footer -->
        <footer class="todo-footer">

            <span id="taskCounter">
                0 tasks remaining
            </span>

            <button id="clearCompletedBtn">
                Clear Completed
            </button>

        </footer>

    </div>


    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
