<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Create Account</title>

    <link rel="stylesheet" href="../css/style.css">
</head>


<body>

    <div class="auth-page">

        <div class="auth-card">

            <!-- Logo -->
            <div class="auth-logo">
                <span>✓</span>
                <h1>TaskFlow</h1>
            </div>

            <!-- Title -->
            <h2>Create Account</h2>

            <p class="auth-subtitle">
                Create your account and start organizing your tasks.
            </p>


            <!-- Sign Up Form -->
            <form id="signupForm">

                <!-- Full Name -->
                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="signupEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Button -->
                <button type="submit" class="auth-btn">
                    Create Account
                </button>

            </form>


            <!-- Login Link -->
            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <!-- Back -->
            <a href="welcome.html" class="back-link">
                ← Back to Welcome
            </a>

        </div>

    </div>

       <script src="../js/auth.js"></script> 

</body>
</html>
