<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Login</title>

    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <!-- Logo -->
            <div class="auth-logo">
                <span>✓</span>
                <h1>TaskFlow</h1>
            </div>

            <!-- Title -->
            <h2>Welcome Back!</h2>

            <p class="auth-subtitle">
                Login to continue managing your tasks.
            </p>


            <!-- Login Form -->
            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit" class="auth-btn">
                    Login
                </button>

            </form>


            <!-- Sign Up -->
            <p class="auth-switch">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </p>


            <!-- Back -->
            <a href="welcome.html" class="back-link">
                ← Back to Welcome
            </a>

        </div>

    </div>

    <script src="../scripts/auth.js"></script>

</body>

</html>
